default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5433) %>

development:
  <<: *default
  database: finpay_api_development
  username: postgres
  password: <%= ENV["DATABASE_PASSWORD"] %>

test:
  <<: *default
  database: finpay_api_test
  username: postgres
  password: <%= ENV["DATABASE_PASSWORD"] %>

production:
  primary: &primary_production
    <<: *default
    database: finpay_api_production
    username: finpay_api
    password: <%= ENV["FINPAY_API_DATABASE_PASSWORD"] %>

  cache:
    <<: *primary_production
    database: finpay_api_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    database: finpay_api_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    database: finpay_api_production_cable
    migrations_paths: db/cable_migrate
